name: Release Firefox

on:
  push:
    branches: [main]
    paths:
      - 'apps/firefox-extension/**'
      - 'apps/shared/**'
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release-firefox.yml'
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: 'Tag to roll back to (e.g. v1.4.2). Leave empty for a normal release.'
        required: false
        default: ''

permissions:
  contents: write

# Publishes the Firefox edition of VideoDefaults: check -> test -> package -> changelog -> AMO sign -> GitHub release.
# See docs/release/amo-developer-setup.md for one-time AMO credential setup and
# docs/release/amo-release-checklist.md for the full manual release process this
# pipeline partially automates.
# Requires secrets: AMO_ISSUER, AMO_SECRET (set in repo settings, never in code).
# This workflow must not run on untrusted PR contexts with privileged secrets.

concurrency:
  group: release-firefox
  cancel-in-progress: false

jobs:
  release:
    name: Check / Test / Package / Sign / Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restrict rollback to repo owner
        if: ${{ github.event.inputs.rollback_ref != '' && github.actor != 'Kotmin' }}
        run: |
          echo "Rollback dispatch is restricted to the repo owner." >&2
          exit 1

      - name: Restore rollback content
        if: ${{ github.event.inputs.rollback_ref != '' }}
        env:
          ROLLBACK_REF: ${{ github.event.inputs.rollback_ref }}
        run: git checkout "$ROLLBACK_REF" -- . ':!.github'

      - name: Bump version above latest release
        if: ${{ github.event.inputs.rollback_ref != '' }}
        env:
          ROLLBACK_REF: ${{ github.event.inputs.rollback_ref }}
        run: |
          LATEST="$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ -z "$LATEST" ]; then
            echo "no v* tags found, cannot determine next version" >&2
            exit 1
          fi
          NEXT="$(echo "$LATEST" | awk -F. '{print $1"."$2"."$3+1}')"
          jq --arg v "$NEXT" '.version = $v' apps/firefox-extension/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json apps/firefox-extension/manifest.json
          echo "Rolling back to $ROLLBACK_REF content, publishing as v$NEXT"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Syntax check and manifest validation
        run: bash scripts/check.sh

      - name: Unit tests
        run: bash scripts/test.sh

      - name: Lint extension (addons-linter)
        run: |
          bash scripts/sync-extension-lib.sh
          npx web-ext lint --source-dir apps/firefox-extension --no-input

      - name: Package firefox-extension
        run: bash scripts/package-extension.sh firefox-extension

      - name: Read release version
        id: version
        run: |
          VERSION="$(jq -r '.version' apps/firefox-extension/manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: release_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        if: ${{ steps.release_check.outputs.exists == 'false' && github.event.inputs.rollback_ref == '' }}
        run: |
          {
            echo "notes<<CHANGELOG_EOF"
            awk -v ver="${{ steps.version.outputs.version }}" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set rollback release notes
        id: rollback_notes
        if: ${{ steps.release_check.outputs.exists == 'false' && github.event.inputs.rollback_ref != '' }}
        run: |
          {
            echo "notes<<CHANGELOG_EOF"
            echo "Rollback republish of ${{ github.event.inputs.rollback_ref }} content, shipped as ${{ steps.version.outputs.tag }}."
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sign with AMO
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        run: |
          npx web-ext sign \
            --api-key="$AMO_ISSUER" \
            --api-secret="$AMO_SECRET" \
            --source-dir apps/firefox-extension \
            --artifacts-dir dist \
            --channel listed
        env:
          AMO_ISSUER: ${{ secrets.AMO_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_SECRET }}

      - name: Upload release artifacts
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: videodefaults-${{ steps.version.outputs.tag }}
          path: |
            dist/*.zip
            dist/*.xpi
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes || steps.rollback_notes.outputs.notes }}
          files: |
            dist/*.zip
            dist/*.xpi
