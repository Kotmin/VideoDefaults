<!--
  Captured live via Playwright/Firefox on https://www.youtube.com/@mkbhd/videos?hl=pl
  outerHTML of the first yt-lockup-view-model card (channel videos grid).
  Same component (yt-lockup-view-model wrapped in ytd-rich-item-renderer, or bare
  in ytd-item-section-renderer) is used on home feed, channel grid, playlist page,
  and the watch page "Up next" sidebar.

  Notable structural, non-text selectors:
  - Video ID: class "content-id-Z6z_feacXW8" on the ytLockupViewModelHost div
    (also available from href="/watch?v=Z6z_feacXW8" on the two <a> tags)
  - Trigger button container: div.ytLockupMetadataViewModelMenuButton > button-view-model > button
    (aria-label text is locale-translated: "More actions" / "Więcej działań" here)
-->
<div class="ytLockupViewModelHost ytLockupViewModelVertical content-id-Z6z_feacXW8 ytLockupViewModelRichGridLegacyMargin ytLockupViewModelFlexNone">
  <yt-touch-feedback-shape aria-hidden="true" class="ytSpecTouchFeedbackShapeHost ytSpecTouchFeedbackShapeTouchResponse ytSpecTouchFeedbackShapeThumbnailSizeLarge ytSpecTouchFeedbackShapeTriggerEvents">
    <div class="ytSpecTouchFeedbackShapeHoverEffect"></div>
    <div class="ytSpecTouchFeedbackShapeStroke"></div>
    <div class="ytSpecTouchFeedbackShapeFill"></div>
  </yt-touch-feedback-shape>
  <a href="/watch?v=Z6z_feacXW8" class="ytLockupViewModelContentImage" aria-haspopup="false" tabindex="-1" aria-hidden="true">
    <yt-thumbnail-view-model class="ytThumbnailViewModelHost ytThumbnailViewModelAspectRatio16By9 ytThumbnailViewModelLarge">
      <div class="ytThumbnailViewModelImage">
        <img class="ytCoreImageHost" alt="" src="https://i.ytimg.com/vi/Z6z_feacXW8/hqdefault.jpg?...">
      </div>
      <yt-thumbnail-bottom-overlay-view-model class="ytThumbnailBottomOverlayViewModelHost">
        <div class="ytThumbnailBottomOverlayViewModelBadgeContainer ytThumbnailBottomOverlayViewModelBadgeContainerLarge">
          <yt-thumbnail-badge-view-model class="ytThumbnailBadgeViewModelHost ytThumbnailBottomOverlayViewModelBadge">
            <badge-shape class="ytBadgeShapeHost ytBadgeShapeThumbnailDefault ytBadgeShapeThumbnailBadge ytBadgeShapeTypography">
              <div class="ytBadgeShapeText">11:36</div>
            </badge-shape>
          </yt-thumbnail-badge-view-model>
        </div>
      </yt-thumbnail-bottom-overlay-view-model>
    </yt-thumbnail-view-model>
  </a>
  <div class="ytLockupViewModelMetadata">
    <yt-lockup-metadata-view-model class="ytLockupMetadataViewModelHost ytLockupMetadataViewModelVertical ytLockupMetadataViewModelStandard ytLockupMetadataViewModelRichGridLegacyTypography ytLockupMetadataViewModelHasMenuButton">
      <div class="ytLockupMetadataViewModelTextContainer">
        <h3 class="ytLockupMetadataViewModelHeadingReset" title="Galaxy Z Fold 8 Review: Honeymoon's Over" aria-label="Galaxy Z Fold 8 Review: Honeymoon's Over">
          <a href="/watch?v=Z6z_feacXW8" class="ytLockupMetadataViewModelTitle" aria-haspopup="false" aria-label="Galaxy Z Fold 8 Review: Honeymoon's Over 11 minut i 36 sekund">
            <span class="ytAttributedStringHost ytAttributedStringWhiteSpacePreWrap" dir="auto" role="text">Galaxy Z Fold 8 Review: Honeymoon's Over</span>
          </a>
        </h3>
        <div class="ytLockupMetadataViewModelMetadata">
          <yt-content-metadata-view-model class="ytContentMetadataViewModelHost ytContentMetadataViewModelMediumText">
            <div class="ytContentMetadataViewModelMetadataRow" role="group">
              <span class="ytAttributedStringHost ytContentMetadataViewModelMetadataText ytAttributedStringWhiteSpacePreWrap ytAttributedStringLinkInheritColor" dir="auto" role="text">3,5&nbsp;mln wyświetleń</span>
              <span aria-hidden="true" class="ytContentMetadataViewModelDelimiter"> &bull; </span>
              <span class="ytAttributedStringHost ytContentMetadataViewModelMetadataText ytContentMetadataViewModelMetadataTextLastPart ytAttributedStringWhiteSpacePreWrap ytAttributedStringLinkInheritColor" dir="auto" aria-label="5 dni temu" role="text">5 dni temu</span>
            </div>
          </yt-content-metadata-view-model>
        </div>
      </div>
      <div class="ytLockupMetadataViewModelMenuButton">
        <button-view-model class="ytSpecButtonViewModelHost">
          <button class="ytSpecButtonShapeNextHost ytSpecButtonShapeNextText ytSpecButtonShapeNextMono ytSpecButtonShapeNextSizeM ytSpecButtonShapeNextIconButton ytSpecButtonShapeNextEnableBackdropFilterExperiment" title="" aria-label="Więcej działań" aria-disabled="false">
            <div aria-hidden="true" class="ytSpecButtonShapeNextIcon ytSpecButtonShapeNextElevatedContent">
              <span class="ytIconWrapperHost" style="width: 24px; height: 24px;"><span class="yt-icon-shape"></span></span>
            </div>
            <yt-touch-feedback-shape aria-hidden="true" class="ytSpecTouchFeedbackShapeHost ytSpecTouchFeedbackShapeTouchResponse">
              <div class="ytSpecTouchFeedbackShapeStroke"></div>
              <div class="ytSpecTouchFeedbackShapeFill"></div>
            </yt-touch-feedback-shape>
          </button>
        </button-view-model>
      </div>
    </yt-lockup-metadata-view-model>
  </div>
</div>
