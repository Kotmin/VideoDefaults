<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VideoDefaults</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <p id="status"></p>
  <div id="presets"></div>
  <div id="custom">
    <input id="speed-input" type="number" min="0.25" max="4" step="0.05" placeholder="e.g. 1.75">
    <button id="apply-btn">Set</button>
  </div>
  <p id="error" hidden></p>
  <label id="auto-apply-label">
    <input id="auto-apply-checkbox" type="checkbox">
    Auto-apply default speed on video load
  </label>
  <script type="module" src="popup.js"></script>
</body>
</html>
