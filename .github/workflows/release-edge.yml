name: Release Edge

on:
  workflow_dispatch:

permissions:
  contents: write

# Publishes the Edge edition of VideoDefaults: check -> test -> package -> changelog -> Edge Add-ons submit -> GitHub release.
# See docs/release/edge-developer-setup.md for one-time Partner Center credential setup
# and docs/release/edge-api-contract-findings.md for the verified API contract this implements.
# Requires secrets: EDGE_CLIENT_ID, EDGE_API_KEY, EDGE_PRODUCT_ID
# (set in repo settings, never in code).
# This workflow must not run on untrusted PR contexts with privileged secrets.
#
# PAUSED (2026-08-06): Edge delivery is delayed pending K's Partner Center
# account. The push-on-main trigger is intentionally removed so this never
# fires on an ordinary dev->main promotion — restore the block below to
# re-enable once EDGE_CLIENT_ID/EDGE_API_KEY/EDGE_PRODUCT_ID are set:
#
#   push:
#     branches: [main]
#     paths:
#       - 'apps/edge-extension/**'
#       - 'apps/shared/**'
#       - 'src/**'
#       - 'scripts/**'
#       - 'tools/**'
#       - 'package.json'
#       - 'package-lock.json'
#       - 'CHANGELOG.md'
#       - '.github/workflows/release-edge.yml'
#
# Even before restoring that trigger, the "Check Edge Add-ons credentials"
# step below keeps workflow_dispatch runs green (publish steps self-skip)
# until the three secrets actually exist.

concurrency:
  group: release-edge
  cancel-in-progress: false

jobs:
  release:
    name: Check / Test / Package / Publish / Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Syntax check and manifest validation
        run: bash scripts/check.sh

      - name: Unit tests
        run: bash scripts/test.sh

      - name: Package edge-extension
        run: bash scripts/package-extension.sh edge-extension

      - name: Read release version
        id: version
        run: |
          VERSION="$(jq -r '.version' apps/edge-extension/manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=edge-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: release_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        run: |
          {
            echo "notes<<CHANGELOG_EOF"
            awk -v ver="${{ steps.version.outputs.version }}" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check Edge Add-ons credentials are configured
        id: edge_secrets
        run: |
          if [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ] && [ -n "$EDGE_PRODUCT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Edge Add-ons secrets not set yet (see docs/release/edge-developer-setup.md) - skipping publish steps."
          fi
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

      - name: Upload package to Edge Add-ons
        id: edge_upload
        if: ${{ steps.release_check.outputs.exists == 'false' && steps.edge_secrets.outputs.configured == 'true' }}
        run: |
          HEADERS_FILE="$(mktemp)"
          HTTP_CODE="$(curl -s -D "$HEADERS_FILE" -o response.json -w '%{http_code}' -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package" \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/zip" \
            --data-binary "@dist/videodefaults-edge-${VERSION}.zip")"
          if [ "$HTTP_CODE" != "202" ]; then
            echo "package upload failed (HTTP $HTTP_CODE):" >&2
            cat response.json >&2
            exit 1
          fi
          OPERATION_ID="$(grep -i '^location:' "$HEADERS_FILE" | tr -d '\r' | awk -F'/' '{print $NF}')"
          if [ -z "$OPERATION_ID" ]; then
            echo "no operation id in Location header:" >&2
            cat "$HEADERS_FILE" >&2
            exit 1
          fi
          echo "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Wait for package processing
        if: ${{ steps.release_check.outputs.exists == 'false' && steps.edge_secrets.outputs.configured == 'true' }}
        run: |
          OPERATION_ID="${{ steps.edge_upload.outputs.operation_id }}"
          for _ in $(seq 1 30); do
            HTTP_CODE="$(curl -s -o response.json -w '%{http_code}' \
              "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/${OPERATION_ID}" \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}")"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "package status check failed (HTTP $HTTP_CODE):" >&2
              cat response.json >&2
              exit 1
            fi
            STATUS="$(jq -r '.status' response.json)"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "package processed"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              echo "package processing failed:" >&2
              cat response.json >&2
              exit 1
            fi
            sleep 20
          done
          echo "timed out waiting for package processing" >&2
          exit 1
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

      - name: Submit for certification
        id: edge_submit
        if: ${{ steps.release_check.outputs.exists == 'false' && steps.edge_secrets.outputs.configured == 'true' }}
        run: |
          HEADERS_FILE="$(mktemp)"
          NOTES="Automated release ${{ steps.version.outputs.tag }}. See CHANGELOG.md."
          HTTP_CODE="$(curl -s -D "$HEADERS_FILE" -o response.json -w '%{http_code}' -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions" \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg notes "$NOTES" '{notes: $notes}')")"
          if [ "$HTTP_CODE" != "202" ]; then
            echo "submission failed (HTTP $HTTP_CODE):" >&2
            cat response.json >&2
            exit 1
          fi
          OPERATION_ID="$(grep -i '^location:' "$HEADERS_FILE" | tr -d '\r' | awk -F'/' '{print $NF}')"
          if [ -z "$OPERATION_ID" ]; then
            echo "no operation id in Location header:" >&2
            cat "$HEADERS_FILE" >&2
            exit 1
          fi
          echo "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

      - name: Wait for submission intake
        if: ${{ steps.release_check.outputs.exists == 'false' && steps.edge_secrets.outputs.configured == 'true' }}
        run: |
          OPERATION_ID="${{ steps.edge_submit.outputs.operation_id }}"
          for _ in $(seq 1 30); do
            HTTP_CODE="$(curl -s -o response.json -w '%{http_code}' \
              "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/operations/${OPERATION_ID}" \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}")"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "submission status check failed (HTTP $HTTP_CODE):" >&2
              cat response.json >&2
              exit 1
            fi
            STATUS="$(jq -r '.status' response.json)"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "submitted for certification"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              echo "submission failed:" >&2
              cat response.json >&2
              exit 1
            fi
            sleep 20
          done
          echo "timed out waiting for submission intake" >&2
          exit 1
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

      - name: Upload release artifacts
        if: ${{ steps.release_check.outputs.exists == 'false' && steps.edge_secrets.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: videodefaults-${{ steps.version.outputs.tag }}
          path: dist/*.zip
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ steps.release_check.outputs.exists == 'false' && steps.edge_secrets.outputs.configured == 'true' }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*.zip
