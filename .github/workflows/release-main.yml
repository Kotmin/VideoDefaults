name: Release Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Publishes VideoDefaults: check -> test -> package -> changelog -> AMO sign -> GitHub release.
# See docs/release/amo-developer-setup.md for one-time AMO credential setup and
# docs/release/amo-release-checklist.md for the full manual release process this
# pipeline partially automates.
# Requires secrets: AMO_ISSUER, AMO_SECRET (set in repo settings, never in code).
# This workflow must not run on untrusted PR contexts with privileged secrets.

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Check / Test / Package / Sign / Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Syntax check and manifest validation
        run: bash scripts/check.sh

      - name: Unit tests
        run: bash scripts/test.sh

      - name: Package Firefox extension
        run: bash scripts/package-firefox.sh

      - name: Read release version
        id: version
        run: |
          VERSION="$(jq -r '.version' apps/firefox-extension/manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: release_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        run: |
          {
            echo "notes<<CHANGELOG_EOF"
            awk -v ver="${{ steps.version.outputs.version }}" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sign with AMO
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        run: |
          npx web-ext sign \
            --api-key="$AMO_ISSUER" \
            --api-secret="$AMO_SECRET" \
            --source-dir apps/firefox-extension \
            --artifacts-dir dist \
            --channel listed
        env:
          AMO_ISSUER: ${{ secrets.AMO_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_SECRET }}

      - name: Upload release artifacts
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: videodefaults-${{ steps.version.outputs.tag }}
          path: |
            dist/*.zip
            dist/*.xpi
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            dist/*.zip
            dist/*.xpi
