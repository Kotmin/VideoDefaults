<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Watch — Fixture</title>
</head>
<body>
  <div id="page-manager">
    <a id="logo" href="https://www.youtube.com/">YouTube Home</a>
    <div id="player">
      <video id="movie_player" playbackRate="1" readyState="4" src="about:blank"></video>
    </div>
    <div id="primary">
      <h1 class="title">Fixture video title</h1>
      <button id="like-button">Like</button>
      <button id="share-button">Share</button>
      <a id="channel-link" href="https://www.youtube.com/@fixture">Channel</a>
    </div>
    <div id="secondary">
      <yt-lockup-view-model>
        <div class="ytLockupMetadataViewModelMenuButton">
          <button id="queue-trigger">More actions</button>
        </div>
      </yt-lockup-view-model>
      <ytm-shorts-lockup-view-model>
        <div class="shortsLockupViewModelHostOutsideMetadataMenu">
          <button id="shorts-queue-trigger">More actions</button>
        </div>
      </ytm-shorts-lockup-view-model>
      <ytd-video-renderer>
        <div id="menu">
          <button id="legacy-queue-trigger">More actions</button>
        </div>
      </ytd-video-renderer>
    </div>
  </div>
  <ytd-popup-container>
    <yt-list-item-view-model role="presentation">
      <button role="menuitem" id="add-to-queue-item">Add to queue</button>
    </yt-list-item-view-model>
  </ytd-popup-container>
</body>
</html>
