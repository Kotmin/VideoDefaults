name: CI Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Check / Test / Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Syntax check and manifest validation
        run: bash scripts/check.sh

      - name: Unit tests
        run: bash scripts/test.sh

      - name: Lint extension (addons-linter)
        run: |
          bash scripts/sync-extension-lib.sh
          npx web-ext lint --source-dir apps/firefox-extension --no-input

      - name: Package extensions (firefox, chrome, edge)
        run: |
          for app in firefox-extension chrome-extension edge-extension; do
            bash scripts/package-extension.sh "$app"
          done

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v7
        with:
          name: videodefaults-unsigned-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30
