name: Release Chrome

on:
  push:
    branches: [main]
    paths:
      - 'apps/chrome-extension/**'
      - 'apps/shared/**'
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release-chrome.yml'
  workflow_dispatch:

permissions:
  contents: write

# Publishes the Chrome edition of VideoDefaults: check -> test -> package -> changelog -> CWS publish -> GitHub release.
# See docs/release/cws-developer-setup.md for one-time Chrome Web Store credential setup.
# Requires secrets: CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_EXTENSION_ID
# (set in repo settings, never in code).
# This workflow must not run on untrusted PR contexts with privileged secrets.

concurrency:
  group: release-chrome
  cancel-in-progress: false

jobs:
  release:
    name: Check / Test / Package / Publish / Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Syntax check and manifest validation
        run: bash scripts/check.sh

      - name: Unit tests
        run: bash scripts/test.sh

      - name: Package chrome-extension
        run: bash scripts/package-extension.sh chrome-extension

      - name: Read release version
        id: version
        run: |
          VERSION="$(jq -r '.version' apps/chrome-extension/manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=chrome-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: release_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        run: |
          {
            echo "notes<<CHANGELOG_EOF"
            awk -v ver="${{ steps.version.outputs.version }}" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Mint Chrome Web Store access token
        id: cws_token
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        run: |
          HTTP_CODE="$(curl -s -o response.json -w '%{http_code}' -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" \
            -d grant_type=refresh_token)"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "token mint failed (HTTP $HTTP_CODE):" >&2
            cat response.json >&2
            exit 1
          fi
          ACCESS_TOKEN="$(jq -r '.access_token' response.json)"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

      - name: Upload to Chrome Web Store
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        run: |
          HTTP_CODE="$(curl -s -o response.json -w '%{http_code}' -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/-/items/${CWS_EXTENSION_ID}:upload" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@dist/videodefaults-chrome-${VERSION}.zip")"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "upload failed (HTTP $HTTP_CODE):" >&2
            cat response.json >&2
            exit 1
          fi
        env:
          ACCESS_TOKEN: ${{ steps.cws_token.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish to Chrome Web Store
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        run: |
          HTTP_CODE="$(curl -s -o response.json -w '%{http_code}' -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/-/items/${CWS_EXTENSION_ID}:publish" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "publish failed (HTTP $HTTP_CODE):" >&2
            cat response.json >&2
            exit 1
          fi
        env:
          ACCESS_TOKEN: ${{ steps.cws_token.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}

      - name: Upload release artifacts
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: videodefaults-${{ steps.version.outputs.tag }}
          path: dist/*.zip
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*.zip
